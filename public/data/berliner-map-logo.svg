    <clipPath id="sphere"><circle cx="128" cy="140" r="81"/></clipPath>
  </defs>
  <!-- Minimal gray antenna -->
  <path d="M125 29h6v19h-6zM121 48h14v8h-14zM118 57h20v5h-20z" fill="#92979D"/>
  <!-- Colored wireframe globe; no fill -->
  <g clip-path="url(#sphere)" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Soviet: right half -->
    <g stroke="#DC4444">
      <path d="M128 59 A81 81 0 0 1 128 221"/>
      <path d="M128 59 C176 83 176 197 128 221"/>
